
name: Build Ilbbang Review APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Check Manifest
        run: |
          echo "----- Actual Manifest File -----"
          cat -A app/src/main/AndroidManifest.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('XML syntax OK')"

      - name: Check Firebase configuration
        run: |
          python3 -c 'import json; d=json.load(open("app/google-services.json")); assert any(c["client_info"]["android_client_info"]["package_name"] == "com.example.ilbbangreview" for c in d["client"]), "Register com.example.ilbbangreview in Firebase and upload its google-services.json"'

      - name: Build APK
        run: gradle assembleDebug --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IlbbangReview-debug
          path: app/build/outputs/apk/debug/app-debug.apk
